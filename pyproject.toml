[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analysis-agent"
version = "0.2.0"
description = "Automated sales data analysis with metadata, lineage, and ontology support"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["sales", "analytics", "data", "metadata", "lineage", "ontology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
analysis-agent = "analysis_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["analysis_agent*"]

[tool.setuptools.package-data]
analysis_agent = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
